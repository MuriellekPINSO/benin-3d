<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
:root{
  --ground:#1A130D; --panel:rgba(28,20,13,.76); --panel-solid:#241A11;
  --line:rgba(246,235,221,.16); --text:#F6EBDD; --muted:#CDBBA5;
  --ochre:#E3A54E; --ochre-ink:#2A1A0A; --red:#C42B35;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.grabbing{cursor:grabbing}
.ui{position:fixed;left:16px;right:16px;pointer-events:none;z-index:2}
.ui > *{pointer-events:auto}
.top{top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{padding:12px 16px 13px;max-width:340px}
.back{display:inline-block;margin-bottom:7px;font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.02em}
.back:hover{color:var(--text)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre);font-weight:600}
h1{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.02;margin:4px 0 4px;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--ochre)}
.sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;padding:4px;gap:2px}
.seg button,.tbtn{appearance:none;border:0;background:transparent;color:var(--text);font:600 13px/1 "Instrument Sans",system-ui,sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;text-decoration:none}
.seg button[aria-pressed="true"]{background:var(--ochre);color:var(--ochre-ink)}
.seg button:not([aria-pressed="true"]):hover,.tbtn:hover{background:rgba(246,235,221,.08)}
.tbtn{display:flex;align-items:center;gap:7px;padding:10px 13px}
.tbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.5}
.tbtn[aria-pressed="true"] .dot{background:var(--ochre);opacity:1;box-shadow:0 0 0 3px rgba(227,165,78,.25)}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.card{bottom:calc(env(safe-area-inset-bottom,0px) + 118px);max-width:360px;padding:12px 16px 14px;right:auto}
.card .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ochre);color:var(--ochre-ink);font:700 12px/1 "Instrument Sans",sans-serif;margin-right:8px;vertical-align:2px}
.card h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:19px;font-weight:700;margin:0 0 5px;letter-spacing:-.005em}
.card p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.dock{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px}
.hint{align-self:flex-start;font-size:12px;color:var(--muted);padding:7px 11px;border-radius:999px}
.hint b{color:var(--text);font-weight:600}
.spots{display:flex;gap:6px;overflow-x:auto;padding:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.spots button{flex:0 0 auto;display:flex;align-items:center;gap:8px;appearance:none;border:1px solid transparent;background:rgba(246,235,221,.06);color:var(--text);font:500 13px/1 "Instrument Sans",system-ui,sans-serif;padding:8px 12px 8px 8px;border-radius:10px;cursor:pointer}
.spots button:hover{background:rgba(246,235,221,.12)}
.spots button .k{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(227,165,78,.2);color:var(--ochre);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.spots button[aria-current="true"]{border-color:var(--ochre);background:rgba(227,165,78,.14)}
.spots button[aria-current="true"] .k{background:var(--ochre);color:var(--ochre-ink)}
.note{font-size:11px;color:var(--muted);opacity:.8;padding:0 4px}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);z-index:5;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:18px;color:var(--ochre);transition:opacity .6s}
#loader.off{opacity:0;pointer-events:none}
@media (max-width:640px){
  h1{font-size:21px}
  .brand{padding:10px 13px;max-width:none;flex:1 1 100%}
  .sub{display:none}
  .ctrl{justify-content:flex-start;flex:1 1 100%}
  .seg button,.tbtn{padding:9px 11px;font-size:12.5px}
  .card{bottom:calc(env(safe-area-inset-bottom,0px) + 112px);max-width:none;right:16px}
  .card p{font-size:12.5px}
  .hint{font-size:11px}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){#loader{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const V3 = THREE.Vector3, D2R = Math.PI/180;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.3, 4000);
camera.rotation.order = 'YXZ';
const ANISO = renderer.capabilities.getMaxAnisotropy();

/* ---------- helpers ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function tex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx||1,ry||1);t.anisotropy=ANISO;return t;
}
function speckle(base, cols, n, size){
  return (g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.globalAlpha=Math.random()*.5+.1;
      const s=Math.random()*size+1;g.fillRect(Math.random()*w,Math.random()*h,s,s);}g.globalAlpha=1;};
}
function std(o){return new THREE.MeshStandardMaterial(Object.assign({roughness:.92,metalness:0},o));}
function merge(geos){
  let pos=[],nor=[];
  geos.forEach(g=>{const n=g.index?g.toNonIndexed():g; if(!n.attributes.normal)n.computeVertexNormals();
    pos.push(...n.attributes.position.array);nor.push(...n.attributes.normal.array);});
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  return out;
}
function add(m,cast,recv){m.castShadow=!!cast;m.receiveShadow=recv!==false;scene.add(m);return m;}
function polar(r,thDeg,y){const t=thDeg*D2R;return new V3(r*Math.sin(t),y||0,r*Math.cos(t));}

/* ---------- textures ---------- */
const T = {
  sand: tex(512,512,(g,w,h)=>{speckle('#D6A35E',['#E7BC7A','#B98646','#C99553','#F0CD92'],9000,2.2)(g,w,h);
        g.strokeStyle='rgba(120,80,30,.08)';g.lineWidth=2;for(let i=0;i<40;i++){g.beginPath();g.moveTo(0,i*13+rnd(-3,3));g.bezierCurveTo(w*.3,i*13+rnd(-6,6),w*.7,i*13+rnd(-6,6),w,i*13);g.stroke();}},10,10),
  laterite: tex(512,512,speckle('#B87250',['#C98660','#9A5A3A','#AC6A48','#D29C78'],12000,2.5),260,260),
  beach: tex(512,512,speckle('#E4C79A',['#F2DDB6','#CDAE7E','#D9BC8C'],9000,2),120,12),
  concrete: tex(512,512,(g,w,h)=>{speckle('#D3CCC0',['#E2DCD2','#BDB5A8','#C9C1B4'],7000,2)(g,w,h);
        g.strokeStyle='rgba(90,80,70,.18)';g.lineWidth=2;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke();}},14,14),
  steps: tex(256,256,speckle('#BDB6AA',['#CFC8BC','#A9A194'],2500,2),1,1),
  road: tex(256,256,speckle('#3B3936',['#4A4743','#2E2C2A'],3000,2),200,2),
  roof: tex(256,64,(g,w,h)=>{g.fillStyle='#F1F0EC';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=16){const gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#E4E3DE');gr.addColorStop(.5,'#FFFFFF');gr.addColorStop(1,'#D9D8D2');g.fillStyle=gr;g.fillRect(x,0,16,h);}},6,1),
  wall: tex(512,256,(g,w,h)=>{g.fillStyle='#DDB77A';g.fillRect(0,0,w,h);
        g.fillStyle='rgba(120,80,40,.10)';for(let x=0;x<w;x+=128)g.fillRect(x,0,3,h);
        g.fillStyle='#8A6A45';for(let x=16;x<w;x+=32){g.fillRect(x,38,10,10);}
        g.fillStyle='rgba(255,255,255,.08)';g.fillRect(0,h-26,w,4);},1,1),
};
T.laterite.repeat.set(260,260);
function facadeTex(doors){
  return tex(1408,336,(g,w,h)=>{
    g.fillStyle='#E2C185';g.fillRect(0,0,w,h);
    g.fillStyle='rgba(150,105,55,.10)';for(let y=0;y<h;y+=28)g.fillRect(0,y,w,2);
    g.fillStyle='#7A5A36';
    for(let r=0;r<3;r++)for(let x=40;x<w-30;x+=30){if((x/30+r)%2<1)g.fillRect(x,26+r*26,12,12);}
    g.fillStyle='#E9CB92';g.fillRect(0,112,w,52);
    g.fillStyle='#4A3020';g.font='800 40px "Bricolage Grotesque", Arial Black, sans-serif';g.textAlign='center';g.textBaseline='middle';
    if(g.letterSpacing!==undefined)g.letterSpacing='10px';
    g.fillText('ARÈNE DE OUIDAH',w/2,139);
    if(doors){g.fillStyle='#3A2A1C';const dw=64,gap=40,n=5,x0=w/2-(n*dw+(n-1)*gap)/2;
      for(let i=0;i<n;i++){g.fillRect(x0+i*(dw+gap),h-104,dw,104);}
      g.fillStyle='#CFAE72';g.fillRect(x0-30,h-116,n*dw+(n-1)*gap+60,10);}
    else{g.fillStyle='#8A6A45';for(let x=60;x<w-40;x+=90)g.fillRect(x,h-120,34,60);}
  });
}

/* ---------- sky ---------- */
const skyU = {uTop:{value:new THREE.Color('#4F93D1')},uHorizon:{value:new THREE.Color('#D3E4EC')},uBottom:{value:new THREE.Color('#C9B79A')},
  uSun:{value:new V3(-.45,.62,.64).normalize()},uSunCol:{value:new THREE.Color('#FFF1D6')},uNight:{value:0}};
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800,48,24), new THREE.ShaderMaterial({
  uniforms:skyU, side:THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uTop,uHorizon,uBottom,uSun,uSunCol;uniform float uNight;varying vec3 vP;
  void main(){vec3 d=normalize(vP);float h=d.y;vec3 c=mix(uHorizon,uTop,pow(clamp(h,0.,1.),.55));
  if(h<0.)c=mix(uHorizon,uBottom,clamp(-h*5.,0.,1.));
  float s=max(dot(d,normalize(uSun)),0.);c+=uSunCol*(pow(s,900.)*1.4+pow(s,10.)*.22*(1.-uNight*.6));
  if(uNight>.5){vec3 q=floor(d*320.);float r=fract(sin(dot(q,vec3(12.9898,78.233,37.719)))*43758.5453);c+=step(.9972,r)*vec3(.85)*smoothstep(.03,.25,h);}
  gl_FragColor=vec4(c,1.);}`
}));
sky.renderOrder=-1; scene.add(sky);
scene.fog = new THREE.Fog(0xD3E4EC, 280, 1300);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xD5E8FF, 0xC98A52, .62); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFF1DC, 1.0);
sun.position.set(-90,125,95); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:10,far:420});
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
scene.add(sun); scene.add(sun.target); sun.target.position.set(0,0,-10);
const spots=[]; [[70,34.5],[110,34.5],[-70,34.5],[-110,34.5],[20,44],[-20,44]].forEach(([th,r],i)=>{
  const p=polar(r,th,i<4?14.2:9);const s=new THREE.SpotLight(0xFFD9A0,0,140,.62,.55,1.2);
  s.position.copy(p);s.target.position.set(p.x*.15,0,p.z*.15);scene.add(s);scene.add(s.target);spots.push(s);});
const tribLight = new THREE.PointLight(0xFFCF8A,0,45,1.5); tribLight.position.set(0,8.5,-29); scene.add(tribLight);

/* ---------- ground ---------- */
function plane(w,d,mat,x,y,z){const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);return m;}
const walk=[];
const lat = add(plane(3000,3000,std({map:T.laterite}),0,-0.08,0),false); walk.push(lat);
const beach = add(plane(3000,112,std({map:T.beach}),0,-0.01,104),false); walk.push(beach);
add(plane(3000,16,std({color:0xB89A6C,roughness:.6}),0,0.0,142),false);
const road = add(plane(3000,13,std({map:T.road}),0,-0.03,-93),false); walk.push(road);
const acc = add(plane(11,600,std({map:(()=>{const t=T.road.clone();t.needsUpdate=true;t.repeat.set(2,90);return t;})()}),0,-0.02,-400),false); walk.push(acc);
const conc = new THREE.Mesh(new THREE.CircleGeometry(57,120).rotateX(-Math.PI/2), std({map:T.concrete})); conc.position.y=0.02; add(conc,false); walk.push(conc);
const fore = add(plane(92,36,std({map:(()=>{const t=T.concrete.clone();t.needsUpdate=true;t.repeat.set(12,5);return t;})()}),0,0.015,-64),false); walk.push(fore);
const sandM = std({map:T.sand,roughness:1});
const sand = new THREE.Mesh(new THREE.CircleGeometry(32.6,160).rotateX(-Math.PI/2), sandM); sand.position.y=0.05; add(sand,false); walk.push(sand);
// thin white edge line of the piste
const edge=new THREE.Mesh(new THREE.RingGeometry(32.5,32.95,160).rotateX(-Math.PI/2),std({color:0xEDE6D8})); edge.position.y=0.06; add(edge,false);

/* ---------- ocean ---------- */
const oceanU={uTime:{value:0},uDeep:{value:new THREE.Color('#15586A')},uShallow:{value:new THREE.Color('#3E9F9A')},uFoam:{value:new THREE.Color('#F4F7F4')},uHorizon:{value:new THREE.Color('#BFD9E2')}};
const oceanG=new THREE.PlaneGeometry(3000,1100,300,110); oceanG.rotateX(-Math.PI/2);
const ocean=new THREE.Mesh(oceanG,new THREE.ShaderMaterial({uniforms:oceanU,fog:false,
 vertexShader:`uniform float uTime;varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);float d=w.z-140.;
  float a=.10+.28*smoothstep(0.,25.,d)*(1.-smoothstep(80.,500.,d));
  w.y+=a*sin(d*.09+uTime*1.1)+.12*sin(w.x*.035+d*.05+uTime*.7);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform float uTime;uniform vec3 uDeep,uShallow,uFoam,uHorizon;varying vec3 vW;
  void main(){float d=vW.z-140.;vec3 c=mix(uShallow,uDeep,smoothstep(0.,170.,d));
  float wv=sin(d*.09+uTime*1.1);float band=smoothstep(.84,1.,wv)*(1.-smoothstep(8.,95.,d));
  float edge=1.-smoothstep(0.,7.,d);float n=fract(sin(dot(floor(vW.xz*1.3),vec2(12.9898,78.233)))*43758.5453);
  float sp=.06*sin(vW.x*.7+uTime*2.)*sin(vW.z*.9-uTime*1.3);
  c=mix(c,uFoam,clamp(band*.75+edge*.9,0.,1.)*(.7+.3*n));c+=sp;
  c=mix(c,uHorizon,smoothstep(260.,1200.,length(vW-cameraPosition)));gl_FragColor=vec4(c,1.);}`}));
ocean.position.set(0,-0.06,138+550); scene.add(ocean);

/* ---------- stands ---------- */
const NR=16, R=i=>33+i*0.9, Y=i=>1.2+i*0.45, TOPW=9.3;
const SECT=[[55,138],[-138,-55]];
function standProfile(){
  const p=[[49.2,0],[49.2,TOPW],[48.4,TOPW],[48.4,Y(NR-1)]];
  for(let i=NR-1;i>=0;i--){p.push([R(i),Y(i)]);p.push([R(i),i>0?Y(i-1):0]);}
  return p;
}
const prof=standProfile();
const profV=[];prof.forEach((q,i)=>{profV.push(new THREE.Vector2(q[0],q[1]));if(i>0&&i<prof.length-1)profV.push(new THREE.Vector2(q[0],q[1]));});
const stepM=std({map:T.steps,side:THREE.DoubleSide});
const wallM=std({color:0xDDB77A,side:THREE.DoubleSide});
const redM=std({color:0xB3262E,roughness:.7});
const shape=new THREE.Shape();prof.forEach((q,i)=>i?shape.lineTo(q[0],q[1]):shape.moveTo(q[0],q[1]));
const capG=new THREE.ShapeGeometry(shape);
SECT.forEach(([a,b])=>{
  const st=new THREE.Mesh(new THREE.LatheGeometry(profV,90,a*D2R,(b-a)*D2R),stepM); add(st,true,true); walk.push(st);
  const fT=T.wall.clone();fT.needsUpdate=true;fT.repeat.set(Math.round(49.25*(b-a)*D2R/9),1);
  const fac=new THREE.Mesh(new THREE.CylinderGeometry(49.25,49.25,TOPW,90,1,true,a*D2R,(b-a)*D2R),std({map:fT}));
  fac.position.y=TOPW/2;add(fac,true,true);
  const par=new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(32.95,0),new THREE.Vector2(32.95,1.45),new THREE.Vector2(32.95,1.45),new THREE.Vector2(33.25,1.45),new THREE.Vector2(33.25,1.45),new THREE.Vector2(33.25,1.2)],90,a*D2R,(b-a)*D2R),wallM);add(par,true,true);
  [a,b].forEach(th=>{const c=new THREE.Mesh(capG,wallM);c.rotation.y=th*D2R-Math.PI/2;add(c,true,true);});
});
// sea wall + filler blocks + red panels
add(new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(44,0),new THREE.Vector2(44,1.1),new THREE.Vector2(44,1.1),new THREE.Vector2(44.45,1.1),new THREE.Vector2(44.45,1.1),new THREE.Vector2(44.45,0)],80,-55*D2R,110*D2R),wallM),true,true);
[-1,1].forEach(s=>{

      else{O.tth-=dx*.0055;O.tph=Math.min(1.5,Math.max(.12,O.tph-dy*.0045));}
    }else if(!TR.anim){const k=.0042*(TR.fov/70);TR.yaw+=dx*k;TR.pitch=Math.min(1.45,Math.max(-1.45,TR.pitch+dy*k));}
  }else if(S.mode==='tour'&&e.pointerType==='mouse'){const h=pickFloor(e);ring.visible=!!h;if(h)ring.position.set(h.x,floorAt(h.x,h.z)+.08,h.z);}
});
function endPtr(e){
  ptrs.delete(e.pointerId);canvas.classList.remove('grabbing');
  if(drag&&drag.moved<7&&performance.now()-drag.t<450)click(e);
  drag=null;if(ptrs.size<2)pinch0=0;
}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;canvas.classList.remove('grabbing');});
canvas.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(e.deltaY*.0012);
  if(S.mode==='orbit')O.tr=Math.min(520,Math.max(28,O.tr*f));else TR.fov=Math.min(95,Math.max(30,TR.fov*f));},{passive:false});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function setRay(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);}
function pickFloor(e){setRay(e);const h=ray.intersectObjects(walk,false)[0];if(!h||h.distance>90)return null;return h.point;}
function click(e){
  setRay(e);const hp=ray.intersectObjects(pins.filter(p=>p.visible),false)[0];
  if(hp){const i=hp.object.userData.i;if(S.mode==='orbit')setMode('tour',i);else goTo(i);return;}
  if(S.mode==='tour'&&!TR.anim){const h=pickFloor(e);if(!h)return;
    const to=new V3(h.x,floorAt(h.x,h.z)+1.65,h.z);
    TR.anim={t0:performance.now(),dur:Math.min(1800,500+to.distanceTo(TR.pos)*40),fp:TR.pos.clone(),fy:TR.yaw,fpi:TR.pitch,ff:TR.fov,tp:to,ty:TR.yaw,tpi:TR.pitch,tf:TR.fov};
    TR.fly=false;S.cur=-1;updateUI();}
}
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;TR.keys[e.code]=true;
  if(S.mode==='tour'&&/^(Arrow|Key[WASD])/.test(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{TR.keys[e.code]=false;});
window.addEventListener('blur',()=>{TR.keys={};});

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const spotsNav=$('spots');
SPOTS.forEach((s,i)=>{const b=document.createElement('button');b.id='spot'+i;b.innerHTML='<span class="k">'+(i+1)+'</span>'+s.t;
  b.addEventListener('click',()=>{if(S.mode==='orbit')setMode('tour',i);else goTo(i);});spotsNav.appendChild(b);});
$('mOrbit').onclick=()=>{if(S.mode!=='orbit')setMode('orbit');};
$('mTour').onclick=()=>{if(S.mode!=='tour')setMode('tour');};
$('tNight').onclick=()=>setNight(!S.night);
$('tAuto').onclick=()=>{S.auto=!S.auto;$('tAuto').setAttribute('aria-pressed',S.auto);};
$('tFull').onclick=()=>{const d=document;try{if(!d.fullscreenElement){const p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}else d.exitFullscreen();}catch(err){}};
document.addEventListener('fullscreenchange',()=>$('tFull').setAttribute('aria-pressed',!!document.fullscreenElement));
const touch=matchMedia('(pointer:coarse)').matches;
function updateUI(){
  const t=S.mode==='tour';
  $('mOrbit').setAttribute('aria-pressed',!t);$('mTour').setAttribute('aria-pressed',t);
  $('tAuto').hidden=t;
  SPOTS.forEach((_,i)=>$('spot'+i).setAttribute('aria-current',t&&S.cur===i));
  $('hint').innerHTML=t
    ?(touch?'<b>Drag</b> to look around · <b>Tap the ground</b> to move · <b>Pinch</b> to zoom':'<b>Drag</b> to look around · <b>Click the ground</b> to move · <b>WASD / arrows</b> to walk · <b>Scroll</b> to zoom')
    :(touch?'<b>Drag</b> to rotate · <b>Pinch</b> to zoom · tap a <b>number</b> to enter':'<b>Drag</b> to rotate · <b>Scroll</b> to zoom · <b>Right-click</b> to pan · click a <b>number</b> to enter');
  const c=$('card');if(t&&S.cur>=0){c.hidden=false;$('cardN').textContent=S.cur+1;$('cardT').textContent=SPOTS[S.cur].t;$('cardD').textContent=SPOTS[S.cur].d;}else c.hidden=true;
}

/* ---------- loop ---------- */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
let last=performance.now();const t0=last;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  oceanU.uTime.value=(now-t0)/1000;
  if(S.mode==='orbit'){
    if(S.auto&&!drag&&ptrs.size===0&&!reduce)O.tth+=dt*.045;
    const k=1-Math.pow(.0025,dt);
    O.th+= (O.tth-O.th)*k;O.ph+=(O.tph-O.ph)*k;O.r+=(O.tr-O.r)*k;O.target.lerp(O.tt,k);
    camera.fov+=(50-camera.fov)*k;
    camera.position.set(O.target.x+O.r*Math.sin(O.ph)*Math.sin(O.th),O.target.y+O.r*Math.cos(O.ph),O.target.z+O.r*Math.sin(O.ph)*Math.cos(O.th));
    camera.lookAt(O.target);
  }else{
    if(TR.anim){const a=TR.anim,k=ease(Math.min(1,(now-a.t0)/a.dur));
      TR.pos.lerpVectors(a.fp,a.tp,k);TR.yaw=a.fy+(((a.ty-a.fy+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*k;
      TR.pitch=a.fpi+(a.tpi-a.fpi)*k;TR.fov=a.ff+(a.tf-a.ff)*k;if(k>=1)TR.anim=null;}
    else{
      const K=TR.keys,fw=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),st=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);
      if(fw||st){const sp=(K.ShiftLeft||K.ShiftRight?14:5.5)*(TR.fly?4:1)*dt;
        TR.pos.x+=(-Math.sin(TR.yaw)*fw+Math.cos(TR.yaw)*st)*sp;TR.pos.z+=(-Math.cos(TR.yaw)*fw-Math.sin(TR.yaw)*st)*sp;
        if(Math.hypot(TR.pos.x,TR.pos.z-40)>520)TR.pos.setLength(TR.pos.length()*.995);
        if(S.cur>=0){S.cur=-1;updateUI();}}
      if(!TR.fly){const ty=floorAt(TR.pos.x,TR.pos.z)+1.65;TR.pos.y+=(ty-TR.pos.y)*Math.min(1,dt*8);}
    }
    camera.position.copy(TR.pos);camera.rotation.set(TR.pitch,TR.yaw,0);camera.fov=TR.fov;
  }
  camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  pins.forEach((p,i)=>{p.visible=!(S.mode==='tour'&&(i===S.cur||(TR.anim&&TR.anim.tp.distanceTo(new V3(p.position.x,TR.anim.tp.y,p.position.z))<1)));
    const d=camera.position.distanceTo(p.position);const sc=S.mode==='orbit'?Math.max(4,d*.035):Math.min(Math.max(1.2,d*.045),12);p.scale.set(sc,sc,1);});
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
setNight(false);updateUI();
if(location.hash==='#visite')setMode('tour',0);
requestAnimationFrame(t=>{frame(t);setTimeout(()=>$('loader').classList.add('off'),120);});
})();
</script>
